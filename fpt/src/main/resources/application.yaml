spring:
  application:
    name: fpt

  datasource:
    url: jdbc:postgresql://localhost:5432/fptschool
    username: postgres
    password: 1231
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect

  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration

server:
  port: 8080

app:
  jwt:
    secret: myFptSchoolSecretKeyForJwtTokenGeneration2026VeryLongAndSecure
    expiration-ms: 86400000  # 24 hours
